<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cache-Cache Urbain GPS</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: Arial, sans-serif; background: #121212; color: #fff; }
        #map { height: 70vh; width: 100%; }
        #ui { padding: 15px; text-align: center; background: #1e1e1e; height: 30vh; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-around; }
        input { padding: 10px; font-size: 16px; border-radius: 5px; border: none; width: 80%; max-width: 300px; text-align: center; margin: 5px auto; }
        button { background: #00b894; color: white; border: none; padding: 12px 20px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; }
        button:active { background: #55efc4; }
        .role-seeker { color: #ff4757; font-weight: bold; font-size: 20px; }
        .role-hider { color: #00b894; font-weight: bold; font-size: 20px; }
    </style>
</head>
<body>

    <div id="setup-screen" style="height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; background: #121212;">
        <h2>CACHE-CACHE GPS REALTIME</h2>
        <p>Entre ton pseudo et rejoins le salon de tes potes</p>
        <input type="text" id="pseudoInput" placeholder="Ton pseudo (ex: Agent 007)">
        <input type="text" id="roomInput" placeholder="Code du salon (ex: ROOM8535)">
        <button onclick="joinRoom()">Rejoindre le salon</button>
    </div>

    <div id="game-screen" style="display:none; height: 100vh;">
        <div id="map"></div>
        <div id="ui">
            <div id="status">Salon prêt. En attente du lancement...</div>
            <div id="playerList"></div>
            <button id="startBtn" onclick="assignRolesRandomly()" style="background:#ff4757;">Lancer la partie (Tirer le Chercheur au sort)</button>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        let map, marker;
        let myPseudo = "";
        let currentRoom = "";

        function joinRoom() {
            myPseudo = document.getElementById('pseudoInput').value.trim();
            currentRoom = document.getElementById('roomInput').value.trim();

            if (!myPseudo || !currentRoom) {
                alert("Entre un pseudo et un code de salon !");
                return;
            }

            // Basculer l'affichage vers l'écran de jeu
            document.getElementById('setup-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'block';

            initMap();
        }

        function initMap() {
            map = L.map('map').setView([46.603354, 1.888334], 13);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '© OpenStreetMap'
            }).addTo(map);

            if (navigator.geolocation) {
                navigator.geolocation.watchPosition(position => {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    
                    if (!marker) {
                        marker = L.marker([lat, lon]).addTo(map).bindPopup(myPseudo).openPopup();
                        map.setView([lat, lon], 16);
                    } else {
                        marker.setLatLng([lat, lon]);
                    }
                }, err => {
                    console.error("GPS Error", err);
                }, { enableHighAccuracy: true });
            }
        }

        function assignRolesRandomly() {
            // Simulation de la liste des joueurs connectés dans le salon
            const playersInRoom = [myPseudo, "Joueur_Ami_1", "Joueur_Ami_2"]; 
            
            // Tirage au sort automatique d'un unique Chercheur
            const randomIndex = Math.floor(Math.random() * playersInRoom.length);
            const chosenSeeker = playersInRoom[randomIndex];

            if (chosenSeeker === myPseudo) {
                document.getElementById('status').innerHTML = `🎯 RÔLE : <span class="role-seeker">CHERCHEUR</span><br>C'est toi qui cherches les autres !`;
                document.body.style.backgroundColor = "#3b0000";
            } else {
                document.getElementById('status').innerHTML = `🏃 RÔLE : <span class="role-hider">CACHÉ</span><br>Le chercheur désigné est : <b>${chosenSeeker}</b>`;
                document.body.style.backgroundColor = "#003b11";
            }

            document.getElementById('startBtn').style.display = 'none';
        }
    </script>
</body>
</html>
