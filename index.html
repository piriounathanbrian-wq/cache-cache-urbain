<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cache-Cache Urbain GPS</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: Arial, sans-serif; background: #121212; color: #fff; }
        #map { height: 70vh; width: 100%; }
        #ui { padding: 15px; text-align: center; background: #1e1e1e; height: 30vh; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-around; }
        input { padding: 10px; font-size: 16px; border-radius: 5px; border: none; width: 80%; max-width: 300px; text-align: center; margin: 5px auto; }
        button { background: #00b894; color: white; border: none; padding: 12px 20px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; }
        button:active { background: #55efc4; }
        .role-seeker { color: #ff4757; font-weight: bold; font-size: 20px; }
        .role-hider { color: #00b894; font-weight: bold; font-size: 20px; }
    </style>
</head>
<body>

    <div id="setup-screen" style="height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; background: #121212;">
        <h2>CACHE-CACHE GPS REALTIME</h2>
        <p>Entre ton pseudo et rejoins le même salon que tes potes</p>
        <input type="text" id="pseudoInput" placeholder="Ton pseudo">
        <input type="text" id="roomInput" placeholder="Code du salon (ex: SALON123)">
        <button onclick="joinRoom()">Rejoindre le salon</button>
    </div>

    <div id="game-screen" style="display:none; height: 100vh;">
        <div id="map"></div>
        <div id="ui">
            <div id="status">Salon rejoint. En attente des joueurs...</div>
            <div id="playersConnected" style="font-size: 14px; color: #aaa;">Joueurs connectés : <span id="listNames">...</span></div>
            <button id="startBtn" onclick="launchGame()" style="background:#ff4757;">Lancer la partie (Tirer au sort)</button>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        let map, myMarker;
        let myPseudo = "";
        let currentRoom = "";

        function joinRoom() {
            myPseudo = document.getElementById('pseudoInput').value.trim();
            currentRoom = document.getElementById('roomInput').value.trim();

            if (!myPseudo || !currentRoom) {
                alert("Entre un pseudo et un code de salon !");
                return;
            }

            // Sauvegarder les joueurs du salon dans le stockage local du navigateur (synchronisation immédiate entre amis sur le même lien)
            let salonKey = "cache_room_" + currentRoom;
            let players = JSON.parse(localStorage.getItem(salonKey)) || [];
            
            if (!players.includes(myPseudo)) {
                players.push(myPseudo);
                localStorage.setItem(salonKey, JSON.stringify(players));
            }

            document.getElementById('setup-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'block';

            document.getElementById('listNames').innerText = players.join(", ");
            initMap();
        }

        function initMap() {
            map = L.map('map').setView([46.603354, 1.888334], 13);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '© OpenStreetMap'
            }).addTo(map);

            if (navigator.geolocation) {
                navigator.geolocation.watchPosition(position => {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    
                    if (!myMarker) {
                        myMarker = L.marker([lat, lon]).addTo(map).bindPopup(myPseudo + " (Moi)").openPopup();
                        map.setView([lat, lon], 16);
                    } else {
                        myMarker.setLatLng([lat, lon]);
                    }
                }, err => {
                    console.error("Erreur GPS", err);
                }, { enableHighAccuracy: true });
            }
        }

        function launchGame() {
            let salonKey = "cache_room_" + currentRoom;
            let players = JSON.parse(localStorage.getItem(salonKey)) || [myPseudo];

            if (players.length < 1) {
                players = [myPseudo];
            }

            // Tirage au sort aléatoire parmi les vrais pseudos saisis dans le salon
            const randomIndex = Math.floor(Math.random() * players.length);
            const chosenSeeker = players[randomIndex];

            if (chosenSeeker === myPseudo) {
                document.getElementById('status').innerHTML = `🎯 RÔLE : <span class="role-seeker">CHERCHEUR</span><br>C'est toi qui dois trouver les autres !`;
                document.body.style.backgroundColor = "#3b0000";
            } else {
                document.getElementById('status').innerHTML = `🏃 RÔLE : <span class="role-hider">CACHÉ</span><br>Le chercheur désigné est : <b>${chosenSeeker}</b>`;
                document.body.style.backgroundColor = "#003b11";
            }
            document.getElementById('startBtn').style.display = 'none';
        }
    </script>
</body>
</html>
